/* 상상 숲 · 화면 장식과 학습 본문을 분리한 공통 테마 */
:root{--ink:#25483a;--muted:#52695b;--teal:#276a51;--pale:#edf5e8;--line:#dbe5d7;--bg:#f8faf3;--warn:#775218;--warnbg:#fff6df;--red:#b23737;--forest-shadow:0 8px 28px #25483a06}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans CJK KR','Noto Sans KR',Arial,sans-serif;background:radial-gradient(ellipse at 0 0,#e9f3e0 0,transparent 50%),var(--bg);letter-spacing:-.25px}
h1,h2{letter-spacing:-.9px}h1{font-size:29px}h2{font-size:23px}h3{font-size:17px}
button{border-radius:12px;padding:11px 17px;transition:background-color .16s,border-color .16s,box-shadow .16s;color:var(--ink)}
button:hover{background:#f3f8ee;border-color:#7eaa80}
button.primary{box-shadow:0 4px 10px #276a5114}button.primary:hover{background:#1d573f;border-color:#1d573f}
button.dark{background:#304b3b;border-color:#304b3b}
button.selected{background:#eaf4e3;border-color:#649069;color:#24583d}
button:disabled{opacity:.6}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #3b8063;outline-offset:3px}
button.small{min-height:36px;font-size:12px}
.demo-banner{background:#faf4df;border-color:#ebe1bf;color:#6b592c;font-size:11px;padding:7px 18px;line-height:1.6}
.topbar{background:#fffef8;border-color:var(--line);padding:17px max(24px,calc((100vw - 1152px)/2));gap:16px}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0;font-size:20px;line-height:1.4}
.brand-mark{display:flex;align-items:center;justify-content:center;width:43px;height:43px;border-radius:14px;background:#eaf2df;color:#386947}
.brand-mark svg{width:28px;height:28px}
.brand .brand-name{display:block;font-size:20px;font-weight:800;letter-spacing:-.8px;color:var(--ink)}
.brand #account-context{font-size:11px;font-weight:500;letter-spacing:0;margin-top:3px}
.forest-icon{display:block;width:22px;height:22px;flex-shrink:0}
.toolbar{gap:7px}.toolbar button{background:#fffef8}
.account-badge{background:#edf4e5;color:#3d6345;font-size:12px;padding:7px 12px}
.shell{max-width:1200px;padding:24px 24px 70px}
.toast{font-size:11px;min-height:18px;margin:0 0 12px}
.toast[hidden]{display:none}.export-wrap{max-width:1200px}
.card{border-radius:22px;border-color:var(--line);padding:28px;background:#fffefb;box-shadow:var(--forest-shadow);margin-bottom:20px}
.tag{background:#edf4e4;border-color:#dce8d0;color:#3b6240;font-size:11px;padding:4px 11px;letter-spacing:.1px}
.notice{background:#f0f6eb;border-color:#dce9d4;color:#3f5d40;border-radius:14px;padding:14px 17px}
.notice.warning{background:var(--warnbg);border-color:#eadebd;color:var(--warn)}
.metric-grid{gap:12px;margin:20px 0}
.metric{background:#f3f7ed;border-color:#e0e8d8;border-radius:16px;padding:17px}
.metric:nth-child(2){background:#faf5e8;border-color:#ebe2ce}.metric:nth-child(3){background:#edf5f0;border-color:#dbe8de}
.metric b{font-size:30px;letter-spacing:-1px;line-height:1.4}.metric span{color:#52695b;font-size:12px}
.progress{height:7px;background:#e7edde;margin:16px 0 24px}.progress i{background:#658b54;border-radius:8px}
.field{margin:17px 0}.field>span{color:#35543f}
.input,.writing-box{border-color:#cbdac4;border-radius:13px;background:#fffefa;padding:13px 15px;color:var(--ink)}
.input{min-height:45px}.writing-box{min-height:150px;line-height:1.95}
.input:hover,.writing-box:hover{border-color:#93b28c}
.input::placeholder,.writing-box::placeholder{color:#70816c}

/* 상상 숲 전체 환경 · 배너 바깥에도 이어지는 풍경 */
body{position:relative;isolation:isolate;background:#edf4e6}
.forest-world{position:fixed;inset:0;z-index:0;pointer-events:none;user-select:none;overflow:hidden;background:#edf4e6;contain:strict}
.forest-world-picture,.forest-world-picture img{display:block;width:100%;height:100%}
.forest-world-picture{position:absolute;inset:0}
.forest-world-picture img{object-fit:cover;object-position:center center}
.forest-atmosphere{position:absolute;inset:0;overflow:hidden}
body>.demo-banner,body>.topbar,body>.export-wrap,body>.shell,body>.print-area{position:relative;z-index:1}
.topbar{background:rgba(255,254,248,.92);border-color:rgba(156,179,133,.4)}
.header-controls{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;min-width:0}
#forest-motion-toggle{background:#fffdf2;border-color:#d4dfbf;color:#46643d;font-size:11px;min-height:38px;white-space:nowrap}
#forest-motion-toggle:disabled{opacity:1;background:#f2f5e8;color:#52694a}
.shell{max-width:1120px}
.card{background:rgba(255,254,248,.96);border-color:rgba(143,171,122,.4);box-shadow:0 10px 34px #2f503610}
.forest-banner{background:rgba(243,249,231,.86);border-color:rgba(144,174,120,.45);box-shadow:0 7px 24px #2f503608}
.forest-banner .forest-eyebrow{color:#3c5c2f}
.forest-banner-copy>p:last-child{color:#3f593d}
.step{background:rgba(255,254,246,.92);border-color:rgba(157,182,137,.4);box-shadow:0 4px 14px #2f503609}
.step.active{background:rgba(232,243,217,.96)}
.teacher-nav{background:rgba(234,242,220,.95)}
.login-shell{background:rgba(255,254,247,.96);border-color:rgba(147,174,125,.45);box-shadow:0 18px 55px #284d3314}
.login-card{background:rgba(255,254,250,.97)}
.toast{color:#3e5d41;text-shadow:0 1px 5px #fffef0,0 0 12px #fffef0}
.forest-leaf{position:absolute;display:block;width:26px;height:42px;color:#89ac5d;opacity:.7;transform-origin:50% 70%;animation:forest-leaf-drift 21s ease-in-out infinite alternate}
.forest-leaf svg{width:100%;height:100%;display:block}
.forest-leaf:nth-child(1){left:3%;top:22%;width:24px;animation-delay:-9s}
.forest-leaf:nth-child(2){right:3%;top:43%;color:#bfbc65;width:20px;animation-duration:25s;animation-delay:-17s}
.forest-leaf:nth-child(3){left:10%;top:64%;color:#70a480;width:19px;animation-duration:26s;animation-delay:-6s}
.forest-leaf:nth-child(4){right:10%;top:17%;width:23px;animation-duration:24s;animation-delay:-13s}
.forest-leaf:nth-child(5){left:17%;top:8%;color:#b1c07a;width:15px;animation-duration:28s;animation-delay:-21s}
.forest-leaf:nth-child(6){right:5%;top:75%;color:#82a869;width:17px;animation-duration:23s;animation-delay:-11s}
.forest-glow{position:absolute;display:block;border-radius:50%;width:230px;height:230px;background:radial-gradient(circle,#fff6cba6 0,#fff9db57 34%,#fffbe100 70%);opacity:.5;animation:forest-light-breathe 18s ease-in-out infinite alternate}
.forest-glow.glow-left{left:-60px;top:32%;animation-delay:-7s}
.forest-glow.glow-right{right:-70px;bottom:7%;width:290px;height:290px;animation-delay:-12s;animation-duration:23s}
.forest-butterfly{position:absolute;display:block;width:31px;height:27px;color:#d8ac46;opacity:.8;animation:forest-butterfly-float 25s ease-in-out infinite alternate}
.forest-butterfly svg{display:block;width:100%;height:100%;overflow:visible}
.forest-butterfly .wing{transform-box:fill-box;transform-origin:center;animation:forest-wing 3.2s ease-in-out infinite alternate}
.forest-butterfly.butterfly-left{left:5%;bottom:16%;animation-delay:-8s}
.forest-butterfly.butterfly-right{right:4%;top:27%;width:24px;animation-duration:29s;animation-delay:-18s}
@keyframes forest-leaf-drift{0%{transform:translate3d(0,-10px,0) rotate(-15deg);opacity:.45}50%{transform:translate3d(14px,14px,0) rotate(5deg);opacity:.75}100%{transform:translate3d(-8px,35px,0) rotate(24deg);opacity:.55}}
@keyframes forest-light-breathe{from{transform:translate3d(0,0,0) scale(.94);opacity:.34}to{transform:translate3d(14px,-19px,0) scale(1.07);opacity:.6}}
@keyframes forest-butterfly-float{0%{transform:translate3d(-8px,8px,0) rotate(-8deg)}50%{transform:translate3d(14px,-12px,0) rotate(6deg)}100%{transform:translate3d(3px,-24px,0) rotate(-3deg)}}
@keyframes forest-wing{from{transform:scaleX(.78)}to{transform:scaleX(1)}}
.forest-world[data-motion="paused"] .forest-atmosphere *{animation-play-state:paused!important}

function renderPlan(app){const existing=currentSession(),groups=state.activeSession==='regular'?state.self:effectiveGroups(),p=existing?{quota:existing.quota,activities:existing.activities,shortage:existing.shortage}:planActivities(groups,state.activeSession);app.innerHTML=steps(0)+'<section class="card"><span class="tag">'+(state.activeSession==='regular'?'진단 뒤 학습 계획':'전체 복습 뒤 보충 계획')+'</span><h1 style="margin-top:16px">문맥 10개를 섞어서 연습해요.</h1><p>최초 진단: '+esc(groupsSummary(state.self))+'</p><p class="fine">이번 배정 기준: '+esc(groupsSummary(groups))+'</p><div class="metric-grid">'+GROUPS.map(g=>metric(p.quota[g]+'개',LABEL[g]+' 객관 활동')).join('')+'</div><div class="notice">60·30·10은 객관 문항 10개의 배정 비중입니다. 빈 그룹은 제외하고 정수로 배분합니다. 문항은 섞어서 연속 출제하며 문제 화면에서 단어 분류를 공개하지 않아요.'+(state.activeSession==='regular'?'<br>객관 연습 뒤에는 교재 순서의 10개 단어를 모두 한 문장씩 씁니다. 전수 작문 10개는 이 비중의 밖입니다.':'')+'</div>'+(p.shortage.length?'<div class="notice warning">새 문항이 부족합니다: '+esc(p.shortage.join(', '))+'. 이전 문항을 복제하지 않으며 새 콘텐츠 보완 전에는 시작하지 않습니다.</div>':'')+'<p class="fine">교사 판정은 아직 만들지 않은 다음 계획에 반영합니다. 이미 배정한 계획·진단·복습 대상과 첫 응답은 유지합니다.</p><div class="button-row">'+btn('진단 확인','data-action="diagnostic"')+btn(existing?'저장한 학습 이어가기':'문장 연습 시작','data-action="start-session" data-testid="start-session" '+(p.activities.length!==10?'disabled':''),'primary')+'</div></section>';bind('diagnostic',()=>setScreen('self'));bind('start-session',()=>{if(!existing){state.sessions[state.activeSession]={id:state.activeSession,contentVersion:DATA.version,quota:p.quota,allocationGroups:{...groups},activities:p.activities,writingActivities:state.activeSession==='regular'?WORDS.map((w,i)=>({id:state.activeSession+'-W'+(i+1),type:'writing',wordId:w.id,meaningId:w.meaning_id})):[],responses:{},writings:{},shortage:p.shortage,currentIndex:0,createdAt:now()};}setScreen('study');});}
function orderedOptions(q){const ids=q.options.map(o=>o.id);let order=state.choiceOrders[q.id];if(!validChoiceOrder(order,q)){order=shuffle(ids);state.choiceOrders[q.id]=order;persist();}return order.map(id=>q.options.find(o=>o.id===id));}
function questionBody(q,r){retrying=!!r?.first&&!!r?.retryEditing;if(!q)return '<div class="notice warning">문항이 준비되지 않았습니다.</div>';const first=r?.first,answered=!!first&&!retrying,currentChoice=answered?(r?.attempts?.at(-1)?.choice||first.choice):(selection??r?.pendingChoice);return '<h2 style="margin-top:18px">빈칸에 알맞은 말을 고르세요.</h2><p class="question">'+esc(q.prompt)+'</p><div class="answers">'+orderedOptions(q).map((o,i)=>'<button class="answer '+(currentChoice===o.id?'selected':'')+'" data-action="option" data-option="'+esc(o.id)+'" data-testid="option-'+esc(o.id)+'" aria-pressed="'+(currentChoice===o.id)+'" '+(answered?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(o.text)+'</span></button>').join('')+'</div>'+(r?.hintShown?'<div class="hint-box">'+esc(q.hint||'문장 앞뒤의 상황을 살펴보세요.')+'</div>':'')+(answered?'<div class="feedback '+(!first.correct?'incorrect':'')+'"><strong>'+(first.correct?'첫 답이 맞았어요.':'쓰임을 다시 확인해요.')+'</strong><p>정답: '+esc(q.options.find(o=>o.id===q.correct_option_id)?.text)+'</p><p>'+esc(q.explanation)+'</p><p class="fine">첫 답 '+(first.correct?'정답':'오답')+' · 첫 제출 전 힌트 '+(first.hinted?'사용':'미사용')+' · 재시도 '+Math.max(0,(r.attempts?.length||1)-1)+'회</p></div>':'')+'<div class="button-row">'+(!answered?btn('단서 보기','data-action="hint" data-testid="hint"')+btn(retrying?'다시 확인하기':'답 제출','data-action="submit-answer" data-testid="submit-answer" '+(!currentChoice?'disabled':''),'primary'):btn('같은 문항 다시 확인','data-action="retry"')+btn('다음','data-action="next" data-testid="next"','primary'))+'</div>';}
function bindQuestion(store,key,q,next){bind('option',e=>{selection=e.currentTarget.dataset.option;store[key]??={hintShown:false,attempts:[]};store[key].pendingChoice=selection;persist();render();});bind('hint',()=>{store[key]??={hintShown:false,attempts:[]};store[key].hintShown=true;persist();render();});bind('submit-answer',()=>{const chosen=selection??store[key]?.pendingChoice;if(!chosen||!q)return;const r=store[key]??={hintShown:false,attempts:[]},a={choice:chosen,correct:chosen===q.correct_option_id,hinted:r.hintShown,submittedAt:now(),...(r.retryQuestionSnapshot?{questionSnapshot:questionCopy(q)}:{})};if(!r.first)r.first={...a};r.attempts.push(a);r.pendingChoice=null;r.retryEditing=false;selection=null;retrying=false;persist();render();});bind('retry',()=>{selection=null;if(store[key]){const latest=item(q.id);if(q.phase==='practice'&&!hasDiagnosticChoices(q)&&hasDiagnosticChoices(latest)){store[key].retryQuestionSnapshot=questionCopy(latest);delete state.choiceOrders[q.id];}if(!store[key].retryEditing)store[key].pendingChoice=null;store[key].retryEditing=true;}retrying=true;persist();render();});bind('next',()=>{remember();next();selection=null;retrying=false;persist();render();window.scrollTo(0,0);});}
function renderStudy(app){const s=currentSession();if(!s){setScreen('plan',false);return;}if(s.currentIndex>=s.activities.length){setScreen(s.writingActivities.length?'writing':'finish',false);return;}const a=s.activities[s.currentIndex],q=studyQuestion(a,s.responses[a.id]),st=sessionStats(s);app.innerHTML=steps(1)+'<section class="card"><div class="row"><span class="tag">'+(s.id==='regular'?'문맥 혼합 연습':'문맥 보충 연습')+' · '+(s.currentIndex+1)+'/'+s.activities.length+'</span><span class="fine">4지선다 · 진단한 단어 중에서 선택</span></div><div class="progress"><i style="width:'+st.objective/s.activities.length*100+'%"></i></div>'+questionBody(q,s.responses[a.id])+'</section>';bindQuestion(s.responses,a.id,q,()=>s.currentIndex++);}
function allDraftsSubmitted(s){return !!s&&s.writingActivities.length===WORDS.length&&s.writingActivities.every(a=>versions(s.writings[a.id]).length);}
function submitOneWriting(s,activityId){const a=s?.writingActivities?.find(a=>a.id===activityId),wr=a?s.writings[a.id]:null;if(!wr)return false;if(versions(wr).length)return true;const text=(wr.draftText||'').trim();if(!text){status('이 단어를 사용한 문장을 먼저 작성하세요.');return false;}wr.versions??=[];wr.versions.push({id:a.id+'-v1',number:1,kind:'draft',text,submittedAt:now()});if(allDraftsSubmitted(s))s.allWritingSubmittedAt??=now();persist();return true;}

function renderWriting(app){const s=currentSession();if(!s){setScreen('plan',false);return;}const done=allDraftsSubmitted(s);app.innerHTML=steps(2)+'<section class="card"><span class="tag">전수 작문 · 교재 순서</span><h1 style="margin-top:16px">10개 단어를 한 문장씩 사용해요.</h1><p>적절한 조사와 동사 활용형을 사용할 수 있어요. 목표 단어를 넣었다는 이유만으로 의미가 맞다고 자동 판정하지 않습니다.</p><div class="notice">10개 초고를 모두 제출한 뒤 전체 복습으로 이동합니다. 한 문장씩 먼저 제출하면 교사가 순서대로 검토할 수 있어요. 10개 모두 제출하면 교사 확인을 기다리지 않고 복습할 수 있어요.</div></section>'+s.writingActivities.map((a,i)=>{const w=word(a.wordId),wr=s.writings[a.id]??={draftText:'',versions:[],grades:[],revisionDraft:''},vs=versions(wr),g=latestGrade(wr),basis=g?vs.find(v=>v.id===g.targetVersionId):null;return '<section class="card"><div class="row"><h2 id="writing-heading-'+esc(a.id)+'">'+(i+1)+'. '+esc(titleWord(w.id))+'</h2><span class="tag">'+(vs.length?(g?'확정 판정 '+gradeText(g.understanding_state):'초고 확인 대기'):'초고 작성')+'</span></div><p id="writing-prompt-'+esc(a.id)+'">'+esc(w.writing?.prompt||'뜻이 드러나는 문장을 쓰세요.')+'</p><p class="fine">도움 틀: '+esc(w.writing?.sentence_frame||'')+'</p>'+(!vs.length?'<textarea class="writing-box" id="writing-input-'+esc(a.id)+'" aria-labelledby="writing-heading-'+esc(a.id)+' writing-prompt-'+esc(a.id)+'" data-writing="'+esc(a.id)+'" data-testid="writing-'+esc(w.id)+'" placeholder="한 문장을 써 주세요.">'+esc(wr.draftText)+'</textarea><div class="button-row">'+btn('이 문장 제출','data-action="submit-draft" data-activity="'+esc(a.id)+'"','primary')+'</div>':'<p class="fine">초고 v1 · '+esc(stamp(vs[0].submittedAt))+'</p><div class="answer-text">'+esc(vs[0].text)+'</div>'+(g?'<div class="feedback"><strong>교사 확인: '+esc(basis?.kind==='revision'?'수정본':'초고')+' v'+esc(basis?.number)+' · '+gradeText(g.understanding_state)+'</strong><p>'+esc(g.comment)+'</p><p class="fine">'+esc(judgmentLabel(g.writing_judgment))+' · '+esc(gradeReason(g))+'</p></div>':'')+vs.slice(1).map(v=>'<div class="answer-text"><strong>수정 v'+v.number+' · '+(wr.grades.some(x=>x.targetVersionId===v.id)?'교사 평가 있음 function learnedTargetWords(){const ids=new Set();for(const s of Object.values(state.sessions)){for(const a of s.activities)if(s.responses[a.id]?.first)ids.add(a.meaningId);for(const a of s.writingActivities||[])if(versions(s.writings[a.id]).length)ids.add(a.meaningId);}return WORDS.filter(w=>ids.has(w.meaning_id));}

function renderReviews(app){app.innerHTML=steps(3)+'<section class="card"><h1>모든 대상 단어를 다시 확인해요.</h1><p>현재 데모의 실제 첫 답·초고 제출 단어를 각 기간 시작 시 고정합니다. 같은 기록으로 기간 흐름을 모의하며 실제 달력별 집계는 구현 전입니다.</p>'+(!canReview()?'<div class="notice warning">정규 객관 10개와 전수 초고 10개를 먼저 제출하세요. 교사 확인 대기는 복습을 막지 않습니다.</div>':'')+'</section><div class="review-grid">'+Object.entries(PHASES).map(([p,l])=>{const r=state.reviews[p],st=reviewStats(r),done=st.total>0&&st.done===st.total;return '<section class="card"><span class="tag">'+l+' 모의 기간</span><h2 style="margin-top:14px">'+l+' 전체 복습</h2><div class="cycle-num">'+st.done+'/'+st.total+'</div><p class="fine">확인 '+percent(st.done,st.total)+' · 첫 정답 '+st.correct+'/'+st.done+'</p>'+btn(done?'결과 확인':st.done?'이어서 확인':'전체 확인 시작','data-action="open-review" data-phase="'+p+'" data-testid="review-'+(p==='weekly'?'week':p==='monthly'?'month':'quarter')+'" '+(!canReview()?'disabled':''),'primary')+(r&&learnedTargetWords().some(w=>!r.targetWordIds.includes(w.id))?btn('새로 학습한 단어 반영','data-action="extend-review" data-phase="'+p+'"'):'')+(done?'<div class="divider"></div>'+btn('보충 계획 보기','data-action="remedial" data-phase="'+p+'"'):'')+'</section>';}).join('')+'</div>';bind('open-review',e=>{if(!canReview())return;remember();const p=e.currentTarget.dataset.phase;state.reviews[p]??=makeReview(p);state.activeReview=p;const r=state.reviews[p];r.currentIndex=r.targetWordIds.findIndex(wid=>!r.responses[wid]?.first);if(r.currentIndex<0)r.currentIndex=r.targetWordIds.length;setScreen('review-question',false);});bind('extend-review',e=>{const r=state.reviews[e.currentTarget.dataset.phase],extra=learnedTargetWords().filter(w=>!r.targetWordIds.includes(w.id));r.questionSnapshots??={};for(const w of extra)r.questionSnapshots[w.id]=questionCopy(ITEMS.find(i=>i.word_id===w.id&&i.phase===r.id));r.targetWordIds.push(...extra.map(w=>w.id));r.targetMeaningIds.push(...extra.map(w=>w.meaning_id));r.targetVersion++;r.completedAt=null;persist();render();});bind('remedial',e=>{const p=e function chooseWritingJudgment(sessionId,activityId,judgment){const wr=state.sessions[sessionId]?.writings[activityId];if(!wr||!['correct','incorrect','uncertain'].includes(judgment))return false;if(!wr.gradeDraft||wr.gradeDraft.targetVersionId!==wr.selectedVersionId)selectGradeVersion(wr,wr.selectedVersionId||versions(wr).at(-1)?.id);const draft=wr.gradeDraft;if(draft.writing_judgment===judgment)return false;const auto=computeAutoUnderstanding(sessionId,activityId,judgment);wr.gradeDraft={targetVersionId:wr.selectedVersionId,writing_judgment:judgment,understanding_state:auto.auto_understanding_state,classification_source:'auto',manual_override:false,override_reason:'',comment:String(draft.comment||''),...auto};persist();return true;}

const CHART_COLORS={known:'#276a51',correct:'#276a51',uncertain:'#D68220',unknown:'#C54040',incorrect:'#C54040',pending:'#9AA6AF'};

function renderDonut(title,subtitle,counts,categories,total,testId){const outerRadius=71,innerRadius=51,ringPath='M 90 19 A 71 71 0 1 1 90 161 A 71 71 0 1 1 90 19 Z M 90 39 A 51 51 0 1 0 90 141 A 51 51 0 1 0 90 39 Z',point=(radius,angle)=>(90+radius*Math.cos(angle)).toFixed(6)+' '+(90+radius*Math.sin(angle)).toFixed(6);let offset=0;const desc=categories.map(c=>c.label+' '+counts[c.id]+'개 '+chartPercent(counts[c.id],total)).join(', '),sectors=categories.map(c=>{const count=counts[c.id],start=total?-Math.PI/2+offset/total*2*Math.PI:0;offset+=count;if(!total||!count)return '';let path=ringPath;if(count<total){const end=-Math.PI/2+offset/total*2*Math.PI,large=count/total>0.5?1:0;path='M '+point(outerRadius,start)+' A 71 71 0 '+large+' 1 '+point(outerRadius,end)+' L '+point(innerRadius,end)+' A 51 51 0 '+large+' 0 '+point(innerRadius,start)+' Z';}return '<path data-chart-category="'+esc(c.id)+'" d="'+path+'" fill="'+CHART_COLORS[c.id]+'" fill-rule="evenodd"/>';}).join('');return '<article class="assessment-chart" data-testid="'+esc(testId)+'"><h3>'+esc(title)+'</h3><p class="fine chart-subtitle">'+esc(subtitle)+'</p><div class="donut-layout"><svg class="donut-svg" viewBox="0 0 180 180" role="img" aria-label="'+esc(title+' · 전체 '+total+'개 · '+desc)+'"><title>'+esc(title+' · '+desc)+'</title><path d="'+ringPath+'" fill="#E7ECEF" fill-rule="evenodd"/>'+sectors+'<text x="90" y="88" text-anchor="middle" font-size="30" font-weight="700" fill="#17384B">'+total+'</text><text x="90" y="109" text-anchor="middle" font-size="12" fill="#4B6474">'+(total?'전체 단어':'대상 없음')+'</text></svg><ul class="chart-legend">'+categories.map(c=>'<li><span class="legend-dot" data-chart-category="'+esc(c.id)+'" style="color:'+CHART_COLORS[c.id]+'" aria-hidden="true">●</span><span>'+esc(c.label)+'</span><strong>'+counts[c.id]+'개 <small>'+chartPercent(counts[c.id],total)+'</small></strong></li>').join('')+'</ul></div></article>';}

function parentReport(){const summary=reportSummary(),st=allStats(),t=state.teacher.status==='confirmed'?state.teacher.confirmedSnapshot:null,examples=[];for(const s of Object.values(state.sessions))for(const a of s.writingActivities||[]){const wr=s.writings[a.id],g=latestGrade(wr),v=g?versions(wr).find(x=>x.id===g.targetVersionId):null;if(g&&v)examples.push({a,g,v});}return '<article class="report-page"><span class="tag">학부모 자료 · 가상 학생 · '+(t?'교사 문구 확인본':'초안')+'</span><h1 style="margin-top:16px">이지우의 어휘 학습 기록</h1><p>별빛국어학원 · 브라우저 데모 누적 기록<br>실제 기간 성적표가 아닙니다. 출력 시각 '+esc(stamp(now()))+'</p>'+renderAssessmentCharts(summary)+renderReportProgress(summary)+'<div class="metric-grid">'+metric(st.regular.objective+'/'+st.regular.objectivePlanned,'객관 연습 제출')+metric(st.regular.writing+'/'+st.regular.writingPlanned,'전수 작문 제출')+metric(st.regular.correct+'/'+st.regular.objective,'객관 첫 정답 / 첫 응답')+'</div><p class="fine">힌트 없이 맞힌 첫 답 '+st.regular.independent+'/'+st.regular.objective+' · 교사 확인 '+st.graded+'/'+st.writing+' · 보충 객관 제출 '+st.remedial+'</p>'+renderAdditionalReview(summary)+'<h2>단어별 교사 평가와 다음 학습</h2>'+wordAssessmentTable()+'<h2>주간·월간·분기 전체 복습</h2><p class="fine">각 기간의 대상은 시작 시 실제 응답·초고 제출 기록의 고유 의미 ID로 고정합니다. 실제 달력 집계는 구현 전입니다.</p><table><thead><tr><th>시범 기간</th><th>전체 확인</th><th>첫 정답</th></tr></thead><tbody>'+Object.entries(PHASES).map(([p,l])=>{const s=reviewStats(state.reviews[p]);return '<tr><td>'+l+'</td><td>'+s.done+'/'+s.total+'</td><td>'+s.correct+'/'+s.done+'</td></tr>';}).join('')+'</tbody></table>'+examples.slice(0,2).map(({a,g,v})=>'<section class="keep"><h2>교사가 확인한 '+esc(titleWord(a.wordId))+' · '+(v.kind==='draft'?'초고':'수정본')+' v'+v.number+'</h2><div class="answer-text">'+esc(v.text)+'</div><p class="message">'+esc(g.comment)+'</p></section>').join('')+(t&&t.includeEvaluation?'<section class="report-long-text"><h2>교사가 직접 작성한 종합 평가</h2><p>'+CATEGORIES.map(k=>k+': '+esc(t.ratings[k])).join(' · ')+'</p>'+[['강점',t.strength],['보완',t.improve],['다음 계획',t.next]].filter(x=>x[1]).map(([k,v])=>'<p class="message"><strong>'+k+'</strong><br>'+esc(v)+'</p>').join('')+'</section>':'')+(t&&t.includeMessage?'<section class="report-long-text"><h2>부모님께 드리는 말씀</h2><p class="message">'+esc(t.parentMessage)+'</p></section>':'')+'<footer class="report-footer">'+(t?esc(t.teacher)+' · '+esc(stamp(t.confirmedAt)):'가상 교사 김선생 · 종합 평가·메시지 미확정')+'<br>검수 전 콘텐츠 시제품이며 학습효과 증빙이 아닙니다. 내부 지도 메모는 포함하지 않으며 자동 발송하지 않습니다.</footer></article>';}
function render(){const loggedIn=signedIn(),app=document.getElementById('app');app.setAttribute('data-view',loggedIn?authSession.role==='teacher'?'teacher':state.screen:'login');document.getElementById('account-toolbar').hidden=!loggedIn;document.getElementById('storage-status').hidden=!loggedIn;if(!loggedIn){authSession=null;document.getElementById('account-context').textContent='학생·교사 로그인';clearPrivatePanels();renderLogin(app);document.getElementById('storage-status').textContent='';return;}state.role=authSession.role;document.getElementById('account-context').textContent=state.role==='student'?'별빛국어학원 · 가상 학생 이지우 · 10개 단어 시범 수업':'별빛국어학원 · 교사 · 학생 학습 관리';document.getElementById('account-badge').textContent=(state.role==='student'?'학생':'교사')+' · '+authSession.username;document.getElementById('export-record').hidden=state.role!=='teacher';document.getElementById('reset').hidden=state.role!=='teacher';document.getElementById('back').disabled=!(state.navigation[state.role]||[]).length;if(!WORDS.length){app.innerHTML='<section class="card"><h1>교재 순서의 첫 10개 콘텐츠 준비 중</h1></section>';return;}if(state.role==='teacher')renderTeacher(app);else if(state.screen==='self')renderSelf(app);else if(state.screen==='plan')renderPlan(app);else if(state.screen==='study')renderStudy(app);else if(state.screen==='writing')renderWriting(app);else if(state.screen==='finish')renderFinish(app);else if(state.screen==='review-question')renderReviewQuestion(app);else if(state.screen==='review-break')renderReviewBreak(app);else renderReviews(app);}
document.getElementById('logout').addEventListener('click',signOut);
document.getElementById('back').addEventListener('click',back);
document.getElementById('reset').addEventListener('click',()=>{if(!signedIn('teacher')||!window.confirm('이 시제품 v2 데모 기록을 초기화할까요? 내려받은 파일과 이전 v1 기록은 남습니다.'))return;const resetFence={modifiedAt:state.modifiedAt,stateRevision:state.stateRevision};state={...fresh(),...resetFence};storageWriteBlocked=false;localSaveWarning='';hostSaveWarning='';storageWarning=recoveredRecords.length?'복구용 원문 '+recoveredRecords.length+'건은 JSON 내보내기에 보관됩니다.':'';clearTransientChoices();clearPrivatePanels();try{localStorage.removeItem(STORAGE_KEY);}catch{}saveRequest++;state.role=authSession.role;persist();status('v2 데모 기록을 초기화했습니다.');render();});
document.getElementById('export-record').addEventListener('click',()=>{if(!signedIn('teacher'))return;document.getElementById('export-json').value=JSON.stringify({type:'vocabulary-pilot-demo-record',version:2,contentApproval:'draft',fictionalStudent:'이지우',exportedAt:now(),state,previousV1Record:legacyRecord,recoveredRecords},null,2);document.getElementById('export-panel').hidden=false;document.getElementById('export-panel').scrollIntoView({behavior:'smooth',block:'start'});status('현재 v2, 이전 v1과 복구용 원문 기록을 표시했습니다.');});
document.getElementById('select-json').addEventListener('click',()=>{const el=document.getElementById('export-json');el.focus();el.select();});document.getElementById('close-export').addEventListener('click',()=>document.getElementById('export-panel').hidden=true);
document.getElementById('download-json').addEventListener('click',()=>{if(!signedIn('teacher'))return;try{const blob=new Blob([document.getElementById('export-json').value],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='어휘학습-v2-가상학생-데모기록.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status('JSON 내려받기를 요청했습니다. 제한되면 전체 선택해 복사하세요.');}catch{status('내려받기가 제한되었습니다. JSON을 복사하세요.');}});
function prepareParentPrint(){document.getElementById('print-area').innerHTML=signedIn('teacher')?parentReport():'';}
window.addEventListener('beforeprint',prepareParentPrint);
window.addEventListener('openai:set_globals',event=>{
  const incoming=event?.detail?.globals?.widgetState??event?.detail?.widgetState;
  if(incoming?.version===1){legacyRecord=incoming;status('v1 공유 기록은 새 흐름과 호환되지 않습니다. JSON 메뉴에서 이전 기록을 내보낼 수 있습니다.');return;}
  if(!safeRecord(incoming)||incoming.version!==2)return;
  let raw;try{raw=JSON.stringify(incoming);if(raw===JSON.stringify(state))return;}catch{return;}
  if(!stateIsNewer(incoming,state)){status('이전 또는 같은 시점의 호스트 기록을 받았습니다. 현재 브라우저의 최신 입력을 유지합니다.');return;}
  const restored=decodeState(raw,'host-event');if(!restored)return;
  state=restored;selection=null;retrying=false;selectedToken=null;selectedRow=null;receivingHostState=true;
  try{render();persist();status(saveStatus());}finally{receivingHostState=false;}
});
const DESIGN_KEY='vocabulary-design-v1';
const DESIGN_NAMES={forest:'디자인 1 · 상상 숲',city:'디자인 2 · 빛의 미래 도시'};
let activeDesign='city',designStorageWarning='';
try{const saved=localStorage.getItem(DESIGN_KEY);if(Object.hasOwn(DESIGN_NAMES,saved))activeDesign=saved;}catch{designStorageWarning='디자인 선택을 저장할 수 없습니다. 현재 창에서는 바꿀 수 있어요.';}
const DESIGN_COPY={
 forest:{loginEyebrow:'생각이 자라는 어휘 숲',studentTitle:'단어를 만나고,<br>생각을 키워요.',teacherTitle:'작은 이해를 발견하고,<br>성장을 함께해요.',teacherEyebrow:'교사의 어휘 정원 · 가상 학생 이지우',step0:'오늘의 어휘 숲',step1:'문맥을 따라 한 걸음',step2:'나만의 문장이 자라는 곳',step3:'다시 만나는 단어 정원'},
 city:{loginEyebrow:'생각의 가능성을 여는 미래 도시',studentTitle:'단어를 탐험하고,<br>생각을 설계해요.',teacherTitle:'오늘의 발견을 모아,<br>다음 성장을 설계해요.',teacherEyebrow:'미래 도시 학습 관제실 · 가상 학생 이지우',step0:'어휘 탐험의 출발점',step1:'문맥 속 단서를 발견하는 시간',step2:'나만의 생각을 만드는 창작실',step3:'발견한 단어를 다시 연결해요'}
};
const CITY_ICON_PATHS={book:'<path d="M3 5c3-1 6 0 9 2 3-2 6-3 9-2v14c-3-1-6 0-9 2-3-2-6-3-9-2ZM12 7v14M6 10h3M15 10h3"/>',leaf:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6ZM12 1v2M12 21v2M1 12h2M21 12h2"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M7 10.5h7M10.5 7v7"/>',teacher:'<rect x="7" y="3" width="10" height="9" rx="3"/><path d="M9 7h1M14 7h1M4 21v-3a5 5 0 0 1 5-4h6a5 5 0 0 1 5 4v3M9 19h6"/>'};
function designText(key){return DESIGN_COPY[activeDesign][key]||'';}
function sceneAsset(scene){return 'assets/'+(activeDesign==='city'?'city-'+(scene==='entrance'?'world':scene):'forest-'+scene)+'.webp';}
function applyDesign(){
 document.documentElement.setAttribute?.('data-design',activeDesign);
 const world=document.getElementById('world-image'),mobile=document.getElementById('world-mobile');
 world.setAttribute('src',sceneAsset('world'));mobile.setAttribute('srcset',sceneAsset('world-mobile'));
 for(const design of ['forest','city']){const button=document.getElementById('design-'+design);button.setAttribute('aria-pressed',String(activeDesign===design));button.classList.toggle('selected',activeDesign===design);}
 document.querySelectorAll('[data-design-scene]').forEach(el=>el.setAttribute('src',sceneAsset(el.dataset.designScene)));
 document.querySelectorAll('[data-design-label]').forEach(el=>el.setAttribute('aria-label',designText(el.dataset.designLabel)));
 document.querySelectorAll('[data-design-copy]').forEach(el=>{el.innerHTML=designText(el.dataset.designCopy);});
 document.querySelectorAll('[data-design-icon]').forEach(el=>{el.innerHTML=forestIcon(el.dataset.designIcon).match(/>([\s\S]*)<\/svg>/)[1];});
 const brand=document.querySelector('.brand-mark');if(brand)brand.innerHTML=forestIcon('book');
 const note=document.getElementById('design-status');note.textContent=designStorageWarning;note.hidden=!designStorageWarning;
 syncForestMotion();
}
function selectDesign(design){
 if(!Object.hasOwn(DESIGN_NAMES,design))return;
 activeDesign=design;try{localStorage.setItem(DESIGN_KEY,design);designStorageWarning='';}catch{designStorageWarning='디자인 선택을 저장하지 못했습니다. 현재 창에서는 적용되며, 새로고침하면 바뀔 수 있어요.';}
 applyDesign();
}
for(const design of ['forest','city'])document.getElementById('design-'+design).addEventListener('click',()=>selectDesign(design));
window.addEventListener('storage',event=>{if(event.key===DESIGN_KEY&&Object.hasOwn(DESIGN_NAMES,event.newValue)){activeDesign=event.newValue;designStorageWarning='';applyDesign();}});

const FOREST_MOTION_KEY='vocabulary-forest-motion-v1',forestMotionMedia=window.matchMedia?.('(prefers-reduced-motion: reduce)')||{matches:false};
let forestMotionEnabled=true;try{forestMotionEnabled=localStorage.getItem(FOREST_MOTION_KEY)!=='off';}catch{}
function syncForestMotion(){const reduced=forestMotionMedia.matches,paused=reduced||!forestMotionEnabled||document.hidden===true,button=document.getElementById('forest-motion-toggle');document.getElementById('forest-world').setAttribute('data-motion',paused?'paused':'running');button.disabled=reduced;button.textContent=reduced?'배경 움직임 최소화':forestMotionEnabled?'배경 움직임 끄기':'배경 움직임 켜기';button.setAttribute('aria-pressed',String(!paused));button.setAttribute('aria-label',reduced?'기기의 동작 줄이기 설정에 따라 배경 움직임이 꺼져 있습니다.':forestMotionEnabled?(activeDesign==='city'?'미래 도시 배경 움직임 끄기':'숲 배경 움직임 끄기'):(activeDesign==='city'?'미래 도시 배경 움직임 켜기':'숲 배경 움직임 켜기'));button.setAttribute('title',reduced?'기기의 동작 줄이기 설정을 따릅니다.':'학습에 맞게 배경 움직임을 조절하세요.');}
document.getElementById('forest-motion-toggle').addEventListener('click',()=>{if(forestMotionMedia.matches)return;forestMotionEnabled=!forestMotionEnabled;try{localStorage.setItem(FOREST_MOTION_KEY,forestMotionEnabled?'on':'off');}catch{}syncForestMotion();});
forestMotionMedia.addEventListener?.('change',syncForestMotion);
document.addEventListener?.('visibilitychange',syncForestMotion);
applyDesign();
status();render();
