<script>
'use strict';
const DATA=JSON.parse(document.getElementById('curriculum-data').textContent),WORDS=(DATA.words||[]).slice().sort((a,b)=>(a.source?.source_order||0)-(b.source?.source_order||0)),ITEMS=DATA.items||[],WORD_MAP=Object.fromEntries(WORDS.map(w=>[w.id,w]));
const STORAGE_KEY='vocabulary-pilot-flow-v2',OLD_KEY='vocabulary-pilot-flow-v1',GROUPS=['unknown','uncertain','known'],LABEL={unknown:'모름',uncertain:'애매함',known:'앎'},PHASES={weekly:'주간',monthly:'월간',quarterly:'분기'},CATEGORIES=['뜻 이해','문맥 추론','작문 활용','학습 태도'],RATINGS=['미평가','우수','안정','연습 중','추가 지도'];
const teacherDefaults=()=>({ratings:Object.fromEntries(CATEGORIES.map(k=>[k,'미평가'])),strength:'',improve:'',next:'',parentMessage:'',internalMemo:'',includeEvaluation:true,includeMessage:true,status:'draft',confirmedSnapshot:null});
const fresh=()=>({version:2,role:'student',screen:'self',teacherScreen:'dashboard',navigation:{student:[],teacher:[]},self:{},selfLocked:false,diagnostic:{assignments:{},unknown:{},wordOrder:[],firstSnapshot:null,postExposureTouched:{},disclosedAt:null,locked:false,results:{}},sessions:{},activeSession:'regular',reviews:{},activeReview:null,teacher:teacherDefaults(),choiceOrders:{},preview:false,createdAt:new Date().toISOString(),modifiedAt:null});
let state=fresh(),selection=null,retrying=false,selectedToken=null,selectedRow=null,storageWarning='',legacyRecord=null,receivingHostState=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString(),word=id=>WORD_MAP[id],item=id=>ITEMS.find(i=>i.id===id),titleWord=id=>word(id)?.display_word||word(id)?.word||id,safeRecord=o=>!!o&&typeof o==='object'&&!Array.isArray(o),percent=(n,d)=>d?Math.round(n/d*100)+'%':'—';
function stamp(s){if(!s)return '미확정';try{return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'medium',timeStyle:'short'}).format(new Date(s));}catch{return String(s);}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function compatibleWidgetState(c){return safeRecord(c)&&c.version===2&&safeRecord(c.self)&&safeRecord(c.sessions)&&safeRecord(c.reviews)&&safeRecord(c.diagnostic)&&Object.values(c.sessions).every(s=>safeRecord(s)&&Array.isArray(s.activities)&&safeRecord(s.responses)&&safeRecord(s.writings))&&Object.values(c.reviews).every(r=>safeRecord(r)&&Array.isArray(r.targetWordIds)&&safeRecord(r.responses));}
function normalize(c){const b=fresh(),t=safeRecord(c.teacher)?c.teacher:{};return {...b,...c,diagnostic:{...b.diagnostic,...c.diagnostic},navigation:{...b.navigation,...(safeRecord(c.navigation)?c.navigation:{})},teacher:{...b.teacher,...t,ratings:{...b.teacher.ratings,...(safeRecord(t.ratings)?t.ratings:{})}}};}
try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(compatibleWidgetState(s))state=normalize(s);else if(s)storageWarning='이전 형식은 새 진단·전수 작문과 호환되지 않아 새 데모로 시작합니다.';legacyRecord=JSON.parse(localStorage.getItem(OLD_KEY)||'null');if(legacyRecord?.version===1)storageWarning='시제품이 v2로 바뀌었습니다. v1 기록은 초기화해 새 흐름으로 시작하며, 이전 기록은 JSON 메뉴에서 내보낼 수 있습니다.';}catch{storageWarning='브라우저 저장을 읽을 수 없습니다. 현재 창에서 진행하거나 JSON을 복사하세요.';}
if(window.openai?.widgetState){if(compatibleWidgetState(window.openai.widgetState)){try{state=normalize(JSON.parse(JSON.stringify(window.openai.widgetState)));}catch{}}else if(window.openai.widgetState.version===1){legacyRecord=window.openai.widgetState;storageWarning='공유된 v1 기록은 새 흐름과 호환되지 않습니다. 새 데모를 시작하며 이전 기록은 JSON 메뉴에서 확인할 수 있습니다.';}}
function status(s){document.getElementById('storage-status').textContent=s||storageWarning||'시제품 v2 · 가상 학생 · 실제 학생 자료를 입력하지 마세요.';}
function persist(){if(!receivingHostState)state.modifiedAt=now();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{storageWarning='저장 실패: 이 창에서 계속 진행하거나 JSON을 전체 선택해 복사하세요.';}if(!receivingHostState){try{const r=window.openai?.setWidgetState?.(JSON.parse(JSON.stringify(state)));r?.catch?.(()=>status('호스트 저장이 제한되었습니다. JSON 복사를 이용하세요.'));}catch{status('호스트 저장이 제한되었습니다.');}}status(storageWarning||'데모 기록 저장 · '+stamp(state.modifiedAt));}
function btn(label,attrs='',kind=''){return '<button class="'+esc(kind)+'" '+attrs+'>'+esc(label)+'</button>';}
function bind(action,fn){document.querySelectorAll('[data-action="'+action+'"]').forEach(el=>el.addEventListener('click',fn));}
function metric(n,label){return '<div class="metric"><b>'+esc(n)+'</b><span>'+esc(label)+'</span></div>';}
function steps(i){return '<nav class="steps" aria-label="학습 단계">'+['진단·계획','이해·추론','표현·수정','복습·재확인'].map((s,j)=>'<div class="step '+(i===j?'active':'')+'">'+(j+1)+' '+s+'</div>').join('')+'</nav>';}
function historySnapshot(){return {screen:state.screen,teacherScreen:state.teacherScreen,activeSession:state.activeSession,activeReview:state.activeReview,sessionIndex:currentSession()?.currentIndex,reviewIndex:state.reviews[state.activeReview]?.currentIndex};}
function remember(){state.navigation[state.role]??=[];state.navigation[state.role].push(historySnapshot());if(state.navigation[state.role].length>80)state.navigation[state.role].shift();}
function setScreen(s,push=true){if(push&&state.screen!==s)remember();state.screen=s;selection=null;retrying=false;selectedToken=null;selectedRow=null;persist();render();window.scrollTo(0,0);}
function teacherPage(s){if(s!==state.teacherScreen)remember();state.teacherScreen=s;persist();render();window.scrollTo(0,0);}
function back(){const h=state.navigation[state.role]||[],p=h.pop();if(!p)return;state.screen=p.screen;state.teacherScreen=p.teacherScreen;state.activeSession=p.activeSession;state.activeReview=p.activeReview;if(currentSession()&&Number.isInteger(p.sessionIndex))currentSession().currentIndex=p.sessionIndex;if(state.reviews[state.activeReview]&&Number.isInteger(p.reviewIndex))state.reviews[state.activeReview].currentIndex=p.reviewIndex;selection=null;retrying=false;selectedToken=null;selectedRow=null;persist();render();window.scrollTo(0,0);}
function groupsCount(groups){return Object.fromEntries(GROUPS.map(g=>[g,WORDS.filter(w=>groups[w.id]===g).length]));}
function groupsSummary(groups){const c=groupsCount(groups);return GROUPS.map(g=>LABEL[g]+' '+c[g]+'개').join(' · ');}
function selectedCount(){return WORDS.filter(w=>state.diagnostic.unknown[w.id]||state.diagnostic.assignments[w.id]).length;}
function diagnosticAssign(rowId,wordId){const d=state.diagnostic;if(d.locked||!word(rowId)||!word(wordId)||d.unknown[rowId])return false;const from=WORDS.find(w=>d.assignments[w.id]===wordId)?.id;if(from&&d.unknown[from])return false;const old=d.assignments[rowId]||null;if(from&&from!==rowId)d.assignments[from]=old;d.assignments[rowId]=wordId;if(d.disclosedAt){d.postExposureTouched[rowId]=true;if(from&&from!==rowId)d.postExposureTouched[from]=true;}selectedToken=null;selectedRow=null;persist();return true;}
function diagnosticUnknown(rowId){const d=state.diagnostic;if(d.locked||d.unknown[rowId]||!word(rowId))return false;if(!d.firstSnapshot){d.firstSnapshot={...d.assignments};d.disclosedAt=now();}const from=WORDS.find(w=>d.assignments[w.id]===rowId)?.id,old=d.assignments[rowId]||null;if(from&&from!==rowId){if(d.unknown[from])return false;d.assignments[from]=old;d.postExposureTouched[from]=true;}d.assignments[rowId]=rowId;d.unknown[rowId]=true;selectedToken=null;selectedRow=null;persist();return true;}
function diagnosticResult(rowId){const d=state.diagnostic,choice=d.assignments[rowId],first=d.firstSnapshot?d.firstSnapshot[rowId]:choice;if(d.unknown[rowId])return {group:'unknown',status:'unknown-auto',choice,firstChoice:first||null,correct:null,exposed:true};const correct=choice===rowId,exposed=!!d.disclosedAt&&(d.postExposureTouched[rowId]||first!==choice||!first),group=correct&&!exposed?'known':'uncertain';return {group,status:correct?(exposed?'exposure-correct':'unexposed-correct'):(exposed?'exposure-incorrect':'unexposed-incorrect'),choice,firstChoice:first||null,correct,exposed};}
function diagnosticStats(){const rows=WORDS.map(w=>state.diagnostic.results[w.id]).filter(Boolean),manual=rows.filter(r=>r.status!=='unknown-auto');return {manualAnswered:manual.length,unknownAuto:rows.length-manual.length,unexposedCorrect:manual.filter(r=>r.status==='unexposed-correct').length,exposedCorrect:manual.filter(r=>r.status==='exposure-correct').length,finalCorrect:manual.filter(r=>r.correct).length,incorrect:manual.filter(r=>!r.correct).length};}

function allocate(groups,total=10){const weights={unknown:60,uncertain:30,known:10},eligible=GROUPS.filter(g=>WORDS.some(w=>groups[w.id]===g)),q={unknown:0,uncertain:0,known:0};if(!eligible.length)return q;const sum=eligible.reduce((n,g)=>n+weights[g],0),raw=eligible.map(g=>({g,n:total*weights[g]/sum}));raw.forEach(x=>q[x.g]=Math.floor(x.n));raw.sort((a,b)=>(b.n%1)-(a.n%1)||GROUPS.indexOf(a.g)-GROUPS.indexOf(b.g));const left=total-Object.values(q).reduce((a,b)=>a+b,0);for(let i=0;i<left;i++)q[raw[i].g]++;return q;}
function planActivities(groups,prefix){const quota=allocate(groups),used=new Set(Object.values(state.sessions).flatMap(s=>s.activities.map(a=>a.itemId))),activities=[],shortage=[];for(const g of GROUPS){const pool=WORDS.filter(w=>groups[w.id]===g);for(let n=0;n<quota[g];n++){let chosen=null,w=null;for(let j=0;j<pool.length;j++){w=pool[(n+j)%pool.length];const candidates=ITEMS.filter(i=>i.word_id===w.id&&i.phase==='practice'&&!used.has(i.id));if(candidates.length){chosen=candidates[n%candidates.length];break;}}if(!chosen){shortage.push(LABEL[g]);continue;}used.add(chosen.id);activities.push({id:prefix+'-Q'+(activities.length+1),type:chosen.type,wordId:w.id,meaningId:w.meaning_id,itemId:chosen.id,group:g,assignedAt:now()});}}const mixed=shuffle(activities);return {quota,activities:mixed,shortage:[...new Set(shortage)]};}

function renderStudy(app){const s=currentSession();if(!s){setScreen('plan',false);return;}if(s.currentIndex>=s.activities.length){setScreen(s.writingActivities.length?'writing':'finish',false);return;}const a=s.activities[s.currentIndex],q=item(a.itemId),st=sessionStats(s);app.innerHTML=steps(1)+'<section class="card"><div class="row"><span class="tag">'+(s.id==='regular'?'문맥 혼합 연습':'문맥 보충 연습')+' · '+(s.currentIndex+1)+'/'+s.activities.length+'</span><span class="fine">4지선다 · 첫 답과 힌트를 별도 기록</span></div><div class="progress"><i style="width:'+st.objective/s.activities.length*100+'%"></i></div>'+questionBody(q,s.responses[a.id])+'</section>';bindQuestion(s.responses,a.id,q,()=>s.currentIndex++);}

function renderWriting(app){const s=currentSession();if(!s){setScreen('plan',false);return;}const done=allDraftsSubmitted(s);app.innerHTML=steps(2)+'<section class="card"><span class="tag">전수 작문 · 교재 순서</span><h1 style="margin-top:16px">10개 단어를 한 문장씩 사용해요.</h1><p>적절한 조사와 동사 활용형을 사용할 수 있어요. 목표 단어를 넣었다는 이유만으로 의미가 맞다고 자동 판정하지 않습니다.</p><div class="notice">10개 초고를 모두 제출한 뒤 전체 복습으로 이동합니다. 한 문장씩 먼저 제출하면 교사가 순서대로 검토할 수 있어요. 10개 모두 제출하면 교사 확인을 기다리지 않고 복습할 수 있어요.</div></section>'+s.writingActivities.map((a,i)=>{const w=word(a.wordId),wr=s.writings[a.id]??={draftText:'',versions:[],grades:[],revisionDraft:''},vs=versions(wr),g=latestGrade(wr),basis=g?vs.find(v=>v.id===g.targetVersionId):null;return '<section class="card"><div class="row"><h2>'+(i+1)+'. '+esc(titleWord(w.id))+'</h2><span class="tag">'+(vs.length?(g?'확정 판정 '+gradeText(g.understanding_state):'초고 확인 대기'):'초고 작성')+'</span></div><p>'+esc(w.writing?.prompt||'뜻이 드러나는 문장을 쓰세요.')+'</p><p class="fine">도움 틀: '+esc(w.writing?.sentence_frame||'')+'</p>'+(!vs.length?'<textarea class="writing-box" data-writing="'+esc(a.id)+'" data-testid="writing-'+esc(w.id)+'" placeholder="한 문장을 써 주세요.">'+esc(wr.draftText)+'</textarea><div class="button-row">'+btn('이 문장 제출','data-action="submit-draft" data-activity="'+esc(a.id)+'"','primary')+'</div>':'<p class="fine">초고 v1 · '+esc(stamp(vs[0].submittedAt))+'</p><div class="answer-text">'+esc(vs[0].text)+'</div>'+(g?'<div class="feedback"><strong>교사 확인: '+esc(basis?.kind==='revision'?'수정본':'초고')+' v'+esc(basis?.number)+' · '+gradeText(g.understanding_state)+'</strong><p>'+esc(g.comment)+'</p><p class="fine">'+esc(judgmentLabel(g.writing_judgment))+' · '+esc(gradeReason(g))+'</p></div>':'')+vs.slice(1).map(v=>'<div class="answer-text"><strong>수정 v'+v.number+' · '+(wr.grades.some(x=>x.targetVersionId===v.id)?'교사 평가 있음':'교사 재확인 대기')+'</strong><br>'+esc(v.text)+'</div>').join('')+(g?'<label class="field"><span>피드백을 반영한 수정 문장</span><textarea class="input" data-revision-input="'+esc(a.id)+'">'+esc function renderFinish(app){const s=currentSession(),st=sessionStats(s);app.innerHTML=steps(2)+'<section class="card"><span class="tag">학습 제출 정리</span><h1 style="margin-top:16px">문맥 연습과 작문을 확인해요.</h1><div class="metric-grid">'+metric(st.objective+'/'+st.objectivePlanned,'객관 제출 · 60/30/10 배정')+metric(st.writing+'/'+st.writingPlanned,'전수 작문 제출 · 비중 밖')+metric(st.unique,'직접 응답·작문한 고유 단어')+'</div><p>객관 첫 정답 '+st.correct+'/'+st.objective+' · 힌트 없이 맞힌 첫 답 '+st.independent+'/'+st.objective+' · 교사 작문 확인 '+st.graded+'/'+st.writing+'</p><div class="notice">초고 제출과 교사 확인은 별도입니다. 교사 검토가 끝나지 않아도 전수 작문 제출을 마치면 전체 복습을 진행할 수 있어요.</div><div class="button-row">'+(s?.writingActivities.length?btn('작문·피드백 확인','data-action="writing"'):'')+btn('주간·월간·분기 전체 복습','data-action="reviews" '+(s?.id==='regular'&&!allDraftsSubmitted(s)?'disabled':''),'primary')+'</div></section>';bind('writing',()=>setScreen('writing'));bind('reviews',()=>setScreen('reviews'));}
function learnedTargetWords(){const ids=new Set();for(const s of Object.values(state.sessions)){for(const a of s.activities)if(s.responses[a.id]?.first)ids.add(a.meaningId);for(const a of s.writingActivities||[])if(versions(s.writings[a.id]).length)ids.add(a.meaningId);}return WORDS.filter(w=>ids.has(w.meaning_id));}
function reviewStats(r){if(!r)return {done:0,total:learnedTargetWords().length,correct:0,independent:0,hints:0};const rs=Object.values(r.responses).filter(x=>x.first).map(x=>x.first);return {done:rs.length,total:r.targetWordIds.length,correct:rs.filter(x=>x.correct).length,independent:rs.filter(x=>x.correct&&!x.hinted).length,hints:rs.filter(x=>x.hinted).length};}
function makeReview(p){const ws=learnedTargetWords();return {id:p,targetWordIds:ws.map(w=>w.id),targetMeaningIds:ws.map(w=>w.meaning_id),targetVersion:1,responses:{},currentIndex:0,chunkBreakAt:null,createdAt:now()};}
function canReview(){return allDraftsSubmitted(state.sessions.regular)&&sessionStats(state.sessions.regular).objective===10;}
function renderReviews(app){app.innerHTML=steps(3)+'<section class="card"><h1>모든 대상 단어를 다시 확인해요.</h1><p>현재 데모의 실제 첫 답·초고 제출 단어를 각 기간 시작 시 고정합니다. 같은 기록으로 기간 흐름을 모의하며 실제 달력별 집계는 구현 전입니다.</p>'+(!canReview()?'<div class="notice warning">정규 객관 10개와 전수 초고 10개를 먼저 제출하세요. 교사 확인 대기는 복습을 막지 않습니다.</div>':'')+'</section><div class="review-grid">'+Object.entries(PHASES).map(([p,l])=>{const r=state.reviews[p],st=reviewStats(r),done=st.total>0&&st.done===st.total;return '<section class="card"><span class="tag">'+l+' 모의 기간</span><h2 style="margin-top:14px">'+l+' 전체 복습</h2><div class="cycle-num">'+st.done+'/'+st.total+'</div><p class="fine">확인 '+percent(st.done,st.total)+' · 첫 정답 '+st.correct+'/'+st.done+'</p>'+btn(done?'결과 확인':st.done?'이어서 확인':'전체 확인 시작','data-action="open-review" data-phase="'+p+'" data-testid="review-'+(p==='weekly'?'week':p==='monthly'?'month':'quarter')+'" '+(!canReview()?'disabled':''),'primary')+(r&&learnedTargetWords().some(w=>!r.targetWordIds.includes(w.id))?btn('새로 학습한 단어 반영','data-action="extend-review" data-phase="'+p+'"'):'')+(done?'<div class="divider"></div>'+btn('보충 계획 보기','data-action="remedial" data-phase="'+p+'"'):'')+'</section>';}).join('')+'</div>';bind('open-review',e=>{if(!canReview())return;remember();const p=e.currentTarget.dataset.phase;state.reviews[p]??=makeReview(p);state.activeReview=p;const r=state.reviews[p];r.currentIndex=r.targetWordIds.findIndex(wid=>!r.responses[wid]?.first);if(r.currentIndex<0)r.currentIndex=r.targetWordIds.length;setScreen('review-question',false);});bind('extend-review',e=>{const r=state.reviews[e.currentTarget.dataset.phase],extra=learnedTargetWords().filter(w=>!r.targetWordIds.includes(w.id));r.targetWordIds.push(...extra.map(w=>w.id));r.targetMeaningIds.push(...extra.map(w=>w.meaning_id));r.targetVersion++;r.completedAt=null;persist();render();});bind('remedial',e=>{const p=e.currentTarget.dataset.phase,r=state.reviews[p],st=reviewStats(r);if(st.done!==st.total)return;remember();state.activeSession='remedial-'+p;setScreen('plan',false);});}
function renderReviewQuestion(app){const r=state.reviews[state.activeReview];if(!r){setScreen('reviews',false);return;}const st=reviewStats(r);if(r.currentIndex>=r.targetWordIds.length){r.completedAt??=now();app.innerHTML=steps(3)+'<section class="card"><h1>전체 '+st.total+'개를 확인했어요.</h1><div class="metric-grid">'+metric(st.done+'/'+st.total,'확인 완료율 '+percent(st.done,st.total))+metric(st.correct+'/'+st.done,'첫 답 정답률 '+percent(st.correct,st.done))+metric(st.independent+'/'+st.done,'힌트 없이 맞힌 첫 답')+'</div><p>전체 확인 뒤 다음 보충 계획은 최신 교사 확정 판정과 수행 기록을 반영합니다. 기존 응답과 분류는 바꾸지 않습니다.</p><div class="button-row">'+btn('기간 목록','data-action="reviews"')+btn('보충 계획 확인','data-action="review-remedial"','primary')+'</div></section>';bind('reviews',()=>setScreen('reviews'));bind('review-remedial',()=>{remember();state.activeSession='remedial-'+r.id;setScreen('plan',false);});return;}const wid=r.targetWordIds[r.currentIndex],q=ITEMS.find(i=>i.word_id===wid&&i.phase===r.id);app.innerHTML=steps(3)+'<section class="card"><div class="row"><span class="tag">'+PHASES[r.id]+' 전체 확인 · '+(r.currentIndex+1)+'/'+st.total+'</span><span class="fine">확인 '+st.done+'/'+st.total+' · 첫 정답 '+st.correct+'/'+st.done+'</span></div>'+questionBody(q,r.responses[wid])+'</section>';bindQuestion(r.responses,wid,q,()=>{r.currentIndex++;if(r.currentIndex===5&&r.currentIndex<r.targetWordIds.length&&!r.chunkBreakAt){r.chunkBreakAt=now();state.screen='review-break';}});}
function renderReviewBreak(app){const st=reviewStats(state.reviews[state.activeReview]);app.innerHTML=steps(3)+'<section class="card"><h1>5개 묶음을 저장했어요.</h1><p>'+st.done+'/'+st.total+'개 확인 · 첫 정답 '+st.correct+'/'+st.done+'</p><div class="button-row">'+btn('저장하고 목록으로','data-action="reviews"')+btn('남은 단어 이어가기','data-action="continue-review"','primary')+'</div></section>';bind('reviews',()=>setScreen('reviews'));bind('continue-review',()=>setScreen('review-question'));}
function resolveUnderstanding(wid){const initial=state.self[wid]||null,grade=latestWordGrade(wid),wrongs=[];for(const s of Object.values(state.sessions))for(const a of s.activities)if(a.wordId===wid&&s.responses[a.id]?.first&&!s.responses[a.id].first.correct)wrongs.push(s.responses[a.id].first.submittedAt||s.createdAt||'');for(const r of Object.values(state.reviews)){const a=r.responses[wid]?.first;if(a&&!a.correct)wrongs.push(a.submittedAt||r.createdAt||'');}if(grade)return {group:grade.understanding_state,source:grade.writing_judgment?'teacher':'legacy-teacher',grade,recheckRequired:wrongs.some(t=>t>grade.confirmedAt),initial};return {group:initial==='known'&&wrongs.length?'uncertain':initial,source:wrongs.length?'diagnostic+response':'diagnostic',grade:null,recheckRequired:wrongs.length>0,initial};}
function effectiveGroups(){return Object.fromEntries(WORDS.map(w=>[w.id,resolveUnderstanding(w.id).group]));}
function allStats(){const all=Object.values(state.sessions).map(sessionStats),sum=k=>all.reduce((n,s)=>n+s[k],0);return {regular:sessionStats(state.sessions.regular),objective:sum('objective'),writing:sum('writing'),graded:sum('graded'),remedial:sum('objective')-sessionStats(state.sessions.regular).objective};}
function gradeText(group){return LABEL[group]||'미판정';}
function wordAssessmentTable(){return '<div class="table-wrap"><table><thead><tr><th>교재 순서·단어</th><th>최초 진단</th><th>교사 작문 판정·분류</th><th>다음 배정</th><th>판정 근거·재확인</th></tr></thead><tbody>'+WORDS.map(w=>{const r=resolveUnderstanding(w.id),g=r.grade;let pending='';if(g){const s=state.sessions[g.sessionId],wr=s?.writings[g.activityId],latest=versions(wr).at(-1);if(latest&&latest.id!==g.targetVersionId)pending=' · 최신 수정본 교사 확인 대기';}return '<tr><td>'+esc(w.source?.source_order)+'. '+esc(titleWord(w.id))+'</td><td>'+gradeText(state.self[w.id])+'</td><td>'+(g?judgmentLabel(g.writing_judgment)+' · '+gradeText(g.understanding_state):'미판정')+'</td><td>'+gradeText(r.group)+'</td><td class="wrap">'+(g?esc(gradeReason(g))+' · '+esc(g.targetVersionId)+pending:'교사 판정 전')+(r.recheckRequired?' · 추가 오답 재확인 필요':'')+'</td></tr>';}).join('')+'</tbody></table></div>';}
function renderTeacher(app){app.innerHTML='<section class="card hero"><span class="tag">교사 모의 화면 · 가상 학생 이지우</span><h1 style="margin-top:16px">학생의 이해를 직접 확인해요.</h1><p>이 화면 전환은 인증·권한 보안을 제공하지 않습니다.</p></section><nav class="teacher-nav">'+[['dashboard','학습·복습 기록'],['grading','10개 작문 검토'],['report','교사 평가·부모 자료']].map(([id,label])=>btn(label,'data-action="teacher-page" data-page="'+id+'"',state.teacherScreen===id?'selected':'')).join('')+'</nav><div id="teacher-main"></div>';const target=document.getElementById('teacher-main');if(state.teacherScreen==='grading')renderGrading(target);else if(state.teacherScreen==='report')renderReportEditor(target);else renderTeacherDashboard(target);bind('teacher-page',e=>teacherPage(e.currentTarget.dataset.page));}
function teacherAnswerMarkup(q,r){const first=r?.first;if(!first)return '<span class="record-answer pending">미제출</span>';const correct=!!first.correct,text=q?.options?.find(o=>o.id===first.choice)?.text||'선택 답안 없음';return '<span class="record-answer '+(correct?'correct':'incorrect')+'">'+esc(text)+' · '+(correct?'정답':'오답')+'</span>';}
function teacherReviewAnswerDetails(){const rows=Object.entries(PHASES).flatMap(([phase,label])=>{const review=state.reviews[phase];return (review?.targetWordIds||[]).map(wid=>{const q=ITEMS.find(i=>i.word_id===wid&&i.phase===phase);return '<tr><td>'+esc(label)+'</td><td>'+esc(titleWord(wid))+'</td><td class="wrap">'+teacherAnswerMarkup(q,review.responses[wid])+'</td></tr>';});});return rows.length?'<details class="review-answer-details"><summary>복습 답안 상세 · '+rows.length+'개</summary><div class="table-wrap"><table><thead><tr><th>기간</th><th>목표 단어</th><th>학생 첫 답</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div></details>':'';}
function renderTeacherDashboard(app){const stats=allStats(),st=stats.regular,ds=diagnosticStats();app.innerHTML='<section class="card"><h2>뜻 연결 진단</h2><p>모름 자동 배치 '+ds.unknownAuto+'개는 정확도에서 제외합니다. 공개 전 정답 '+ds.unexposedCorrect+'/'+ds.manualAnswered+' · 공개 후 정답 '+ds.exposedCorrect+'개는 재확인이 필요합니다.</p></section>'+'<section class="card"><h2>제출 기록 · 단계를 구분해 집계</h2><div class="notice warning">아래는 같은 데모 누적 기록입니다. 실제 일간·주간·월간 집계 엔진은 구현 전입니다.</div><div class="metric-grid">'+metric(st.objective+'/'+st.objectivePlanned,'정규 객관 제출 · 배분 대상')+metric(st.writing+'/'+st.writingPlanned,'전수 작문 제출 · 배분 밖')+metric(st.graded+'/'+st.writing,'교사 확인한 단어 작문')+'</div><p>정규 객관 첫 정답 '+st.correct+'/'+st.objective+' · 힌트 없이 맞힌 첫 답 '+st.independent+'/'+st.objective+' · 고유 학습 단어 '+st.unique+'</p><p class="fine">학생 첫 답: 정답은 청록색, 오답은 빨간색으로 표시합니다. 재시도 후에도 첫 답의 결과를 유지합니다.</p><p class="fine">정규 객관 배정 분류별 완료: '+GROUPS.map(g=>LABEL[g]+' '+st.groups[g]).join(' · ')+' · 보충 객관 제출 '+stats.remedial+'</p><div class="table-wrap"><table><thead><tr><th>구간·문항</th><th>목표 단어</th><th>배정 당시 분류</th><th>첫 답</th><th>상태</th></tr></thead><tbody>'+Object.values(state.sessions).flatMap(s=>s.activities.map(a=>{const r=s.responses[a.id],q=item(a.itemId);return '<tr><td>'+esc(s.id)+' · '+esc(a.id)+'</td><td>'+esc(titleWord(a.wordId))+'</td><td>'+gradeText(a.group)+'</td><td class="wrap">'+teacherAnswerMarkup(q,r)+'</td><td>'+esc(r?.first?(r.first.hinted?'힌트 사용':'힌트 미사용'):'진행 전')+'</td></tr>';})).join('')+'</tbody></table></div></section><section class="card"><h2>단어별 판정과 다음 배정</h2><p class="fine">교사 확정 판정이 우선입니다. 이후 오답은 재확인 필요로 표시하며 교사 분류를 자동으로 바꾸지 않습니다.</p>'+wordAssessmentTable()+'</section><section class="card"><h2>기간 전체 복습</h2><p class="fine">현재 제출 기록으로 기간 흐름을 모의하며, 시작 시 대상 의미 ID와 기존 답안을 고정합니다.</p><div class="table-wrap"><table><thead><tr><th>기간</th><th>전체 확인</th><th>첫 정답</th><th>첫 힌트 없는 정답</th><th>미확인·오답</th></tr></thead><tbody>'+Object.entries(PHASES).map(([p,l])=>{const r=state.reviews[p],s=reviewStats(r),targets=r?r.targetWordIds.map(word):learnedTargetWords();return '<tr><td>'+l+'</td><td>'+s.done+'/'+s.total+' · '+percent(s.done,s.total)+'</td><td>'+s.correct+'/'+s.done+'</td><td>'+s.independent+'/'+s.done+'</td><td class="wrap">미확인 '+esc(targets.filter(w=>!r?.responses[w.id]?.first).map(w=>titleWord(w.id)).join(', ')||'없음')+'<br>'+((wrongWords=>wrongWords?'<span class="record-answer incorrect">오답 '+esc(wrongWords)+'</span>':'오답 없음')(targets.filter(w=>r?.responses[w.id]?.first&&!r.responses[w.id].first.correct).map(w=>titleWord(w.id)).join(', ')))+'</td></tr>';}).join('')+'</tbody></table></div>'+teacherReviewAnswerDetails()+'</section>';}

function renderReportProgress(summary=reportSummary()){const entries=[['정규 객관 연습',summary.objectiveProgress],['전수 작문 제출',summary.writingProgress]];return '<section class="report-progress keep"><h2>학습 진행</h2><div class="report-progress-grid">'+entries.map(([label,p])=>'<div class="progress-item"><div class="row"><strong>'+label+'</strong><span>완료 '+p.completed+' / '+p.total+' · 미완료 '+p.remaining+'</span></div><svg class="report-progress-svg" viewBox="0 0 300 8" preserveAspectRatio="none" role="img" aria-label="'+esc(label+' 완료 '+p.completed+'개, 미완료 '+p.remaining+'개')+'"><rect x="0" y="0" width="300" height="8" rx="4" fill="#E3EAEE"/><rect x="0" y="0" width="'+(p.total?300*p.completed/p.total:0)+'" height="8" rx="4" fill="#087487"/></svg></div>').join('')+'</div><p class="fine">작문 제출과 교사의 정답 판정은 별도로 집계합니다.</p></section>';}
function renderAdditionalReview(summary=reportSummary()){return '<section class="additional-review keep"><h2>추가 복습과 재확인</h2>'+(summary.additionalReviewWords.length?'<ul class="review-word-list">'+summary.additionalReviewWords.map(r=>'<li><strong>'+esc(r.word)+'</strong><span>'+esc(r.reviewReason)+'</span></li>').join('')+'</ul>':'<p class="fine">현재 확정 판정과 수행 기록에서 추가 복습 후보가 없습니다.</p>')+(summary.revisionPendingCount?'<p class="fine">수정본 확인 대기: '+esc(summary.revisionPendingWords.map(r=>r.word).join(', '))+'</p>':'')+'<div class="next-learning-plan"><strong>다음 학습 계획</strong><span>모름 60% · 애매함 30% · 앎 10%</span><p class="fine">다음 객관 활동의 배정 원칙입니다. 위 차트는 실제 확정 분포를 표시하며 빈 그룹은 배정 때 제외합니다.</p></div></section>';}

function teacherField(k,label){return '<label class="field"><span>'+esc(label)+'</span><textarea class="input" data-report-field="'+k+'" data-testid="report-'+k+'">'+esc(state.teacher[k]||'')+'</textarea></label>';}
function renderReportEditor(app){const summary=reportSummary();app.innerHTML='<section class="card report-analytics">'+renderAssessmentCharts(summary)+renderReportProgress(summary)+renderAdditionalReview(summary)+'</section>'+'<section class="card"><h2>교사 평가와 부모님께 전할 말</h2><p class="fine">학습 태도는 관찰 근거가 있을 때 선택합니다. 단어별 작문 판정·이해 그룹과 종합 평가는 별도입니다.</p><div class="grid equal">'+CATEGORIES.map(k=>'<label class="field"><span>'+k+'</span><select class="input" data-report-rating="'+k+'">'+RATINGS.map(v=>'<option '+(state.teacher.ratings[k]===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label>').join('')+'</div>'+teacherField('strength','학생의 강점')+teacherField('improve','보완할 점')+teacherField('next','다음 지도 계획')+teacherField('parentMessage','부모님께 직접 쓰는 메시지')+teacherField('internalMemo','내부 지도 메모 · 부모 출력 제외')+'<div class="row"><label><input type="checkbox" data-report-checkbox="includeEvaluation" '+(state.teacher.includeEvaluation?'checked':'')+'> 종합 평가 포함</label><label><input type="checkbox" data-report-checkbox="includeMessage" '+(state.teacher.includeMessage?'checked':'')+'> 확정 부모 메시지 포함</label></div><div class="notice">'+(state.teacher.status==='confirmed'?'교사 문구 확인본 · '+esc(stamp(state.teacher.confirmedSnapshot?.confirmedAt)):'편집 중 초안 · 확정 전 문구는 부모 출력에 포함하지 않습니다.')+'</div><div class="button-row">'+btn('평가·메시지 확정','data-action="confirm-report"','primary')+btn('부모 자료 미리보기','data-action="preview-report"')+btn('부모 자료 인쇄 / PDF','data-action="print-report" data-testid="print-report"','dark')+'</div><div id="report-preview" class="preview-panel '+(state.preview?'open':'')+'">'+parentReport()+'</div></section>';document.querySelectorAll('[data-report-field]').forEach(el=>el.addEventListener('input',()=>{state.teacher[el.dataset.reportField]=el.value;state.teacher.status='draft';persist();}));document.querySelectorAll('[data-report-rating]').forEach(el=>el.addEventListener('change',()=>{state.teacher.ratings[el.dataset.reportRating]=el.value;state.teacher.status='draft';persist();}));document.querySelectorAll('[data-report-checkbox]').forEach(el=>el.addEventListener('change',()=>{state.teacher[el.dataset.reportCheckbox]=el.checked;state.teacher.status='draft';persist();}));bind('confirm-report',()=>{if(state.teacher.includeMessage&&!state.teacher.parentMessage.trim()){status('부모 메시지를 쓰거나 포함을 해제하세요.');return;}const priorSnapshot=validAssessmentSnapshot(state.teacher.confirmedSnapshot?.assessmentSnapshot)?state.teacher.confirmedSnapshot.assessmentSnapshot:null,reportVersion=(state.teacher.confirmedSnapshot?.version||0)+1,confirmedAt=now(),summaryForSnapshot=reportSummary();state.teacher.status='confirmed';state.teacher.confirmedSnapshot={assessmentSnapshot:assessmentSnapshot(summaryForSnapshot,reportVersion,confirmedAt),previousAssessmentSnapshot:priorSnapshot,ratings:{...state.teacher.ratings},strength:state.teacher.strength,improve:state.teacher.improve,next:state.teacher.next,parentMessage:state.teacher.parentMessage,includeEvaluation:state.teacher.includeEvaluation,includeMessage:state.teacher.includeMessage,teacher:'가상 교사 김선생',confirmedAt,version:reportVersion};persist();render();});bind('preview-report',()=>{state.preview=!state.preview;persist();render();document.getElementById('report-preview')?.scrollIntoView({behavior:'smooth',block:'start'});});bind('print-report',()=>{document.getElementById('print-area').innerHTML=parentReport();window.print();});}
function parentReport(){const summary=reportSummary(),st=allStats(),t=state.teacher.status==='confirmed'?state.teacher.confirmedSnapshot:null,examples=[];for(const s of Object.values(state.sessions))for(const a of s.writingActivities||[]){const wr=s.writings[a.id],g=latestGrade(wr),v=g?versions(wr).find(x=>x.id===g.targetVersionId):null;if(g&&v)examples.push({a,g,v});}return '<article class="report-page"><span class="tag">학부모 자료 · 가상 학생 · '+(t?'교사 문구 확인본':'초안')+'</span><h1 style="margin-top:16px">이지우의 어휘 학습 기록</h1><p>별빛국어학원 · 브라우저 데모 누적 기록<br>실제 기간 성적표가 아닙니다. 출력 시각 '+esc(stamp(now()))+'</p>'+renderAssessmentCharts(summary)+renderReportProgress(summary)+'<div class="metric-grid">'+metric(st.regular.objective+'/'+st.regular.objectivePlanned,'객관 연습 제출')+metric(st.regular.writing+'/'+st.regular.writingPlanned,'전수 작문 제출')+metric(st.regular.correct+'/'+st.regular.objective,'객관 첫 정답 / 첫 응답')+'</div><p class="fine">힌트 없이 맞힌 첫 답 '+st.regular.independent+'/'+st.regular.objective+' · 교사 확인 '+st.graded+'/'+st.writing+' · 보충 객관 제출 '+st.remedial+'</p>'+renderAdditionalReview(summary)+'<h2>단어별 교사 평가와 다음 학습</h2>'+wordAssessmentTable()+'<h2>주간·월간·분기 전체 복습</h2><p class="fine">각 기간의 대상은 시작 시 실제 응답·초고 제출 기록의 고유 의미 ID로 고정합니다. 실제 달력 집계는 구현 전입니다.</p><table><thead><tr><th>시범 기간</th><th>전체 확인</th><th>첫 정답</th></tr></thead><tbody>'+Object.entries(PHASES).map(([p,l])=>{const s=reviewStats(state.reviews[p]);return '<tr><td>'+l+'</td><td>'+s.done+'/'+s.total+'</td><td>'+s.correct+'/'+s.done+'</td></tr>';}).join('')+'</tbody></table>'+examples.slice(0,2).map(({a,g,v})=>'<section class="keep"><h2>교사가 확인한 '+esc(titleWord(a.wordId))+' · '+(v.kind==='draft'?'초고':'수정본')+' v'+v.number+'</h2><div class="answer-text">'+esc(v.text)+'</div><p class="message">'+esc(g.comment)+'</p></section>').join('')+(t&&t.includeEvaluation?'<section class="keep"><h2>교사가 직접 작성한 종합 평가</h2><p>'+CATEGORIES.map(k=>k+': '+esc(t.ratings[k])).join(' · ')+'</p>'+[['강점',t.strength],['보완',t.improve],['다음 계획',t.next]].filter(x=>x[1]).map(([k,v])=>'<p class="message"><strong>'+k+'</strong><br>'+esc(v)+'</p>').join('')+'</section>':'')+(t&&t.includeMessage?'<section class="keep"><h2>부모님께 드리는 말씀</h2><p class="message">'+esc(t.parentMessage)+'</p></section>':'')+'<footer class="report-footer">'+(t?esc(t.teacher)+' · '+esc(stamp(t.confirmedAt)):'가상 교사 김선생 · 종합 평가·메시지 미확정')+'<br>검수 전 콘텐츠 시제품이며 학습효과 증빙이 아닙니다. 내부 지도 메모는 포함하지 않으며 자동 발송하지 않습니다.</footer></article>';}
function render(){document.getElementById('student-tab').classList.toggle('active',state.role==='student');document.getElementById('teacher-tab').classList.toggle('active',state.role==='teacher');document.getElementById('back').disabled=!(state.navigation[state.role]||[]).length;const app=document.getElementById('app');if(!WORDS.length){app.innerHTML='<section class="card"><h1>교재 순서의 첫 10개 콘텐츠 준비 중</h1></section>';return;}if(state.role==='teacher')renderTeacher(app);else if(state.screen==='self')renderSelf(app);else if(state.screen==='plan')renderPlan(app);else if(state.screen==='study')renderStudy(app);else if(state.screen==='writing')renderWriting(app);else if(state.screen==='finish')renderFinish(app);else if(state.screen==='review-question')renderReviewQuestion(app);else if(state.screen==='review-break')renderReviewBreak(app);else renderReviews(app);}
for(const role of ['student','teacher'])document.getElementById(role+'-tab').addEventListener('click',()=>{state.role=role;selection=null;retrying=false;selectedToken=null;selectedRow=null;persist();render();});
document.getElementById('back').addEventListener('click',back);
document.getElementById('reset').addEventListener('click',()=>{if(!window.confirm('이 시제품 v2 데모 기록을 초기화할까요? 내려받은 파일과 이전 v1 기록은 남습니다.'))return;state=fresh();selection=null;retrying=false;selectedToken=null;selectedRow=null;document.getElementById('export-panel').hidden=true;document.getElementById('export-json').value='';try{localStorage.removeItem(STORAGE_KEY);}catch{}try{window.openai?.setWidgetState?.(JSON.parse(JSON.stringify(state)));}catch{}status('v2 데모 기록을 초기화했습니다.');render();});
document.getElementById('export-record').addEventListener('click',()=>{document.getElementById('export-json').value=JSON.stringify({type:'vocabulary-pilot-demo-record',version:2,contentApproval:'draft',fictionalStudent:'이지우',exportedAt:now(),state,previousV1Record:legacyRecord},null,2);document.getElementById('export-panel').hidden=false;document.getElementById('export-panel').scrollIntoView({behavior:'smooth',block:'start'});status('현재 v2와 보관된 이전 v1 데모 기록을 표시했습니다.');});
document.getElementById('select-json').addEventListener('click',()=>{const el=document.getElementById('export-json');el.focus();el.select();});document.getElementById('close-export').addEventListener('click',()=>document.getElementById('export-panel').hidden=true);
document.getElementById('download-json').addEventListener('click',()=>{try{const blob=new Blob([document.getElementById('export-json').value],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download='어휘학습-v2-가상학생-데모기록.json';document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status('JSON 내려받기를 요청했습니다. 제한되면 전체 선택해 복사하세요.');}catch{status('내려받기가 제한되었습니다. JSON을 복사하세요.');}});
window.addEventListener('openai:set_globals',event=>{const incoming=event?.detail?.globals?.widgetState??event?.detail?.widgetState;if(!compatibleWidgetState(incoming)){if(incoming?.version===1){legacyRecord=incoming;status('v1 공유 기록은 새 흐름과 호환되지 않습니다. JSON 메뉴에서 이전 기록을 내보낼 수 있습니다.');}return;}let c;try{const json=JSON.stringify(incoming);if(json===JSON.stringify(state))return;c=JSON.parse(json);}catch{return;}state=normalize(c);selection=null;retrying=false;selectedToken=null;selectedRow=null;receivingHostState=true;try{render();status('호스트의 v2 데모 기록을 불러왔습니다.');}finally{receivingHostState=false;}});
status();render();
</script>
</body>
